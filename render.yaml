services:
  - type: web
    name: aeo-engine-api
    runtime: python
    buildCommand: cd backend && pip install -e .
    startCommand: cd backend && uvicorn aeo_engine.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
